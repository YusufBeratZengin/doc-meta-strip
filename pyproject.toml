[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "doc-meta-strip"
version = "0.1.0"
description = "Offline, lossless metadata remover for PDF, DOCX, XLSX, JPEG, PNG and WebP files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YusufBeratZengin" }]
keywords = [
  "privacy",
  "security",
  "metadata",
  "exif",
  "pdf",
  "docx",
  "xlsx",
  "osint",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Archiving",
  "Typing :: Typed",
]
dependencies = [
  "pypdf>=4.0,<7",
  "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.scripts]
doc-meta-strip = "doc_meta_strip.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/doc-meta-strip"
Issues = "https://github.com/YusufBeratZengin/doc-meta-strip/issues"
Changelog = "https://github.com/YusufBeratZengin/doc-meta-strip/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["doc_meta_strip"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --cov=doc_meta_strip --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["doc_meta_strip"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["doc_meta_strip", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PIE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["doc_meta_strip"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
